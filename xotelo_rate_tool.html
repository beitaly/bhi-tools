<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Rate Checker - BHI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1F4E79;--orange:#D4613D;--ink:#1a1a1a;--mid:#888;--border:#e4e4e4;--bg:#F0EDE8;--surface:#fff;--grey:#F5F5F5;--green:#2e7d32;--red:#c62828}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:2rem}
.topbar{max-width:1300px;margin:0 auto 1.5rem;display:flex;align-items:baseline;gap:1rem}
.topbar-brand{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.topbar h1{font-size:1rem;font-weight:500;color:var(--blue)}
.panel{max-width:1300px;margin:0 auto;background:var(--surface);border-radius:3px;box-shadow:0 2px 24px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);overflow:hidden;margin-bottom:1.5rem}
.input-strip{background:var(--blue);padding:1.1rem 1.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.field input,.field select,.field textarea{font-family:'DM Mono',monospace;font-size:.78rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:3px;color:#fff;padding:.42rem .65rem;outline:none}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.3)}
.field select option{background:var(--blue);color:#fff}
.field-full{width:100%}
.field-full input,.field-full textarea{width:100%}
textarea#hotelList{resize:vertical;min-height:80px;line-height:1.7}
.field-narrow input,.field-narrow select{width:100px}
.field-wide input{width:320px}
.btn{border:none;border-radius:3px;font-family:'DM Mono',monospace;font-size:.78rem;font-weight:500;padding:.5rem 1.1rem;cursor:pointer;align-self:flex-end;white-space:nowrap}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8)}
.btn-ghost.connected{border-color:#4CAF50;color:#4CAF50}
.btn:disabled{opacity:.35;cursor:default}
.divider{width:1px;height:36px;background:rgba(255,255,255,.15);align-self:flex-end}
.status-bar{background:#f8f7f5;border-bottom:1px solid var(--border);padding:.5rem 1.5rem;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--mid);min-height:32px;display:flex;align-items:center;gap:.75rem}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.status-dot.active{background:#4CAF50;animation:pulse 1.5s infinite}
.status-dot.error{background:var(--orange)}
.status-dot.done{background:var(--blue)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.results-area{padding:1.25rem 1.5rem;min-height:200px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;gap:.5rem;color:var(--mid)}
.empty-text{font-size:.8rem;font-family:'DM Mono',monospace}
.hotel-card{border:1px solid var(--border);border-radius:3px;margin-bottom:1rem;overflow:hidden}
.hotel-card-header{background:var(--grey);padding:.65rem 1rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--border)}
.hotel-key{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mid);text-transform:uppercase}
.hotel-name{font-size:.85rem;font-weight:500;color:var(--blue)}
.hotel-stars{font-size:.7rem;color:#c8a400}
.hotel-meta{font-size:.75rem;color:var(--mid);font-style:italic;margin-left:auto}
.rate-table-wrap{overflow-x:auto}
table.rate-table{width:100%;border-collapse:collapse;font-size:.75rem}
table.rate-table th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);padding:.45rem .7rem;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.rate-table th:first-child{text-align:left}
table.rate-table td{padding:.4rem .7rem;border-bottom:1px solid #f0f0f0;text-align:right;font-family:'DM Mono',monospace;font-size:.74rem;vertical-align:top}
table.rate-table td:first-child{text-align:left;color:var(--mid);font-size:9px;text-transform:uppercase;white-space:nowrap}
table.rate-table tr:last-child td{border-bottom:none}
.cell-val{display:inline-block;padding:.18rem .45rem;border-radius:2px;font-weight:500}
.cell-empty{color:#ccc}
.cell-low{font-size:9px;color:var(--mid);font-family:'DM Mono',monospace;display:block;margin-top:1px}
.summary-row td{background:#f0f5fa!important;font-weight:500;border-top:1px solid #c8d9ea;border-bottom:none!important;color:var(--blue)}
.legend{display:flex;align-items:center;gap:.35rem;padding:.75rem 1rem;border-top:1px solid var(--border);font-family:'DM Mono',monospace;font-size:9px;color:var(--mid);flex-wrap:wrap}
.legend-swatch{width:14px;height:10px;border-radius:1px}
.section-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin:1.25rem 0 .5rem}
.sheet-strip{background:#1a3d5c;padding:.8rem 1.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end;border-top:1px solid rgba(255,255,255,.08)}
.tab-chips{display:flex;flex-wrap:wrap;gap:.4rem;align-self:flex-end}
.tab-chip{font-family:'DM Mono',monospace;font-size:9px;padding:.25rem .6rem;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:rgba(255,255,255,.6);cursor:pointer;user-select:none}
.tab-chip.active{background:var(--orange);border-color:var(--orange);color:#fff}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-brand">BHI - Voyage Prive</span>
  <h1>Hotel Rate Checker</h1>
</div>
<div class="panel">
  <div class="input-strip">
    <div class="field field-wide">
      <label>Proxy URL (Railway)</label>
      <input type="text" id="proxyUrl" value="https://web-production-57cc2.up.railway.app">
    </div>
    <div class="divider"></div>
    <div class="field field-wide">
      <label>Google Sheet URL (optional)</label>
      <input type="text" id="sheetUrl" placeholder="Paste Google Sheets share link">
    </div>
    <button class="btn btn-ghost" id="connectBtn">Connect Google</button>
    <button class="btn btn-ghost" id="loadSheetBtn" disabled>Load Sheet</button>
    <div class="divider"></div>
    <div class="field field-narrow">
      <label>Year</label>
      <input type="number" id="year" value="2026" min="2024" max="2030">
    </div>
    <div class="field field-narrow">
      <label>Nights</label>
      <input type="text" id="nights" value="5,7,9,11">
    </div>
    <div class="field field-narrow">
      <label>Currency</label>
      <select id="currency">
        <option value="EUR" selected>EUR</option>
        <option value="GBP">GBP</option>
        <option value="USD">USD</option>
      </select>
    </div>
    <button class="btn btn-orange" id="runBtn">Run</button>
    <button class="btn btn-ghost" id="exportBtn" disabled>CSV</button>
  </div>
  <div class="sheet-strip" id="sheetStrip" style="display:none">
    <div class="field">
      <label>Select destination tab</label>
      <div class="tab-chips" id="tabChips"></div>
    </div>
    <div class="field field-full">
      <label>Hotels from sheet (editable — add | Location if needed)</label>
      <textarea id="hotelList" placeholder="Hotels will load here when you click a tab"></textarea>
    </div>
  </div>
  <div id="manualStrip" style="background:#1a3d5c;padding:.8rem 1.5rem;border-top:1px solid rgba(255,255,255,.08)">
    <div class="field field-full">
      <label style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)">Manual entry — Hotel Name | Location</label>

    </div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Enter hotels and click Run</span>
  </div>
  <div class="results-area" id="resultsArea">
    <div class="empty-state"><div class="empty-text">Rates will appear here</div></div>
  </div>
</div>

function getLocationForTab(tab) {
  // Strip trailing digits to get base code
  var base = tab.replace(/\d+$/, '').toUpperCase();
  return CITY_LOOKUP[base] || CITY_LOOKUP[tab.toUpperCase()] || 'Italy';
}

function isHotelName(h) {
  if (!h || h.length < 4) return false;
  // Skip if contains known non-hotel patterns
  for (var i = 0; i < SKIP_PATTERNS.length; i++) {
    if (h.indexOf(SKIP_PATTERNS[i]) !== -1) return false;
  }
  // Skip if contains special unicode chars
  for (var j = 0; j < SKIP_CHARS.length; j++) {
    if (h.indexOf(SKIP_CHARS[j]) !== -1) return false;
  }
  // Skip rows that start with symbols, numbers, brackets
  if (/^[\[\(\*\-=>#\d]/.test(h)) return false;
  // Skip rows that look like formulas or totals
  if (/^(x|X|\u00d7)\s*\d/.test(h)) return false;
  return true;
}

function extractSheetId(url) {
  var m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

async function loadSheet() {
  var sheetUrl = document.getElementById('sheetUrl').value.trim();
  if (!sheetUrl) { setStatus('Paste a Google Sheets URL first', 'error'); return; }
  var sheetId = extractSheetId(sheetUrl);
  if (!sheetId) { setStatus('Could not parse sheet ID from URL', 'error'); return; }
  currentSheetId = sheetId;
  var proxy = document.getElementById('proxyUrl').value.trim().replace(/\/$/, '');
  setStatus('Loading sheet tabs...', 'active');
  try {
    var r = await fetch(proxy + '/sheet/tabs?sheet_id=' + sheetId + '&token=' + googleToken);
    var j = await r.json();
    if (j.error) throw new Error(j.error);
    renderTabChips(j.tabs);
    document.getElementById('sheetStrip').style.display = '';
    document.getElementById('manualStrip').style.display = 'none';
    setStatus('Sheet loaded - click a destination tab to load its hotels', 'done');
  } catch(e) {
    setStatus('Sheet error: ' + e.message, 'error');
  }
}

// Skip tabs that are not destination tabs
var SKIP_TABS = ['Prorata','Template','Summary','SUMMARY','Instructions','Istruzioni','README','Info','Cover'];

function renderTabChips(tabs) {
  var container = document.getElementById('tabChips');
  container.innerHTML = '';
  tabs.forEach(function(tab) {
    if (SKIP_TABS.indexOf(tab) !== -1) return;
    // Skip tabs that look like night-variant copies (10nts, 12nts etc)
    if (/\d+\s*nts?/i.test(tab)) return;
    var chip = document.createElement('span');
    chip.className = 'tab-chip';
    chip.textContent = tab;
    chip.addEventListener('click', function() {
      document.querySelectorAll('.tab-chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      loadTabHotels(tab);
    });
    container.appendChild(chip);
  });
}

async function loadTabHotels(tab) {
  var proxy = document.getElementById('proxyUrl').value.trim().replace(/\/$/, '');
  setStatus('Loading hotels from ' + tab + '...', 'active');
  try {
    var r = await fetch(proxy + '/sheet?sheet_id=' + currentSheetId + '&tab=' + encodeURIComponent(tab) + '&token=' + googleToken);
    var j = await r.json();
    if (j.error) throw new Error(j.error);
    // Filter to hotel names only
    var hotels = j.hotels.filter(isHotelName);
    // Append | Italy as default location (editable by user)
    var loc = getLocationForTab(tab);
    document.getElementById('hotelList').value = hotels.map(function(h){ return h + ' | ' + loc; }).join('\n');
    setStatus('Loaded ' + hotels.length + ' hotels from ' + tab + ' - adjust locations if needed, then click Run', 'done');
  } catch(e) {
    setStatus('Error loading tab: ' + e.message, 'error');
  }
}

function heatColour(t) {
  if (t === null) return { bg: 'transparent', fg: '#ccc' };
  var stops = [[183,225,161],[255,240,160],[255,178,80]];
  var r, g, b, u;
  if (t <= 0.5) {
    u = t * 2;
    r = stops[0][0] + (stops[1][0]-stops[0][0])*u;
    g = stops[0][1] + (stops[1][1]-stops[0][1])*u;
    b = stops[0][2] + (stops[1][2]-stops[0][2])*u;
  } else {
    u = (t - 0.5) * 2;
    r = stops[1][0] + (stops[2][0]-stops[1][0])*u;
    g = stops[1][1] + (stops[2][1]-stops[1][1])*u;
    b = stops[1][2] + (stops[2][2]-stops[1][2])*u;
  }
  return { bg: 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')', fg: t > 0.65 ? '#5a3800' : '#1a4000' };
}

function normalise(values) {
  var valid = values.filter(function(v){ return v !== null && v > 0; });
  if (!valid.length) return values.map(function(){ return null; });
  var mn = Math.min.apply(null, valid), mx = Math.max.apply(null, valid);
  var span = mx - mn || 1;
  return values.map(function(v){ return (v === null || v === 0) ? null : (v - mn) / span; });
}

function fmtDate(year, monthIdx, day) {
  return year + '-' + String(monthIdx+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
}

function addNights(dateStr, nights) {
  var d = new Date(dateStr);
  d.setDate(d.getDate() + nights);
  return d.toISOString().slice(0,10);
}

function parseNights() {
  return document.getElementById('nights').value
    .split(',').map(function(s){ return parseInt(s.trim()); }).filter(function(n){ return n > 0; });
}

function parseHotels() {
  var useSheet = document.getElementById('sheetStrip').style.display !== 'none';
  var src = useSheet ? document.getElementById('hotelList').value : document.getElementById('hotelListManual').value;
  return src.split('\n').map(function(s){ return s.trim(); }).filter(Boolean)
    .map(function(line) {
      var parts = line.split('|').map(function(p){ return p.trim(); });
      return { name: parts[0], location: parts[1] || '', label: line };
    });
}

function delay(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

function setStatus(msg, state) {
  document.getElementById('statusText').textContent = msg;
  var dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (state ? ' ' + state : '');
}

function currencySymbol() {
  var c = document.getElementById('currency').value;
  return c === 'EUR' ? '\u20AC' : c === 'GBP' ? '\u00A3' : '$';
}

async function fetchSnapshot(hotelName, location, cin, cout, currency) {
  var proxyBase = document.getElementById('proxyUrl').value.trim().replace(/\/$/, '');
  var query = location ? hotelName + ' ' + location : hotelName;
  var url = proxyBase + '/rates?q=' + encodeURIComponent(query) +
    '&check_in_date=' + cin + '&check_out_date=' + cout + '&currency=' + currency;
  try {
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var j = await r.json();
    if (j.error) throw new Error(String(j.error));
    if (j.name && j.rate_per_night) {
      var rate = j.rate_per_night.extracted_lowest || j.rate_per_night.extracted_before_taxes_fees || null;
      return { price: rate ? Math.round(rate) : null, hotelName: j.name,
        rating: j.overall_rating || null, reviews: j.reviews || null,
        stars: j.hotel_class ? String(j.hotel_class).replace(/[^0-9]/g,'') : null };
    }
    var props = j.properties || [];
    if (props.length) {
      var lc = hotelName.toLowerCase();
      var match = props.find(function(p){ return p.name && p.name.toLowerCase().indexOf(lc) !== -1; }) || props[0];
      var rate2 = match.rate_per_night ? (match.rate_per_night.extracted_lowest || match.rate_per_night.extracted_before_taxes_fees || null) : null;
      return { price: rate2 ? Math.round(rate2) : null, hotelName: match.name || null,
        rating: match.overall_rating || null, reviews: match.reviews || null,
        stars: match.hotel_class ? String(match.hotel_class).replace(/[^0-9]/g,'') : null };
    }
    return { price: null, hotelName: null, rating: null, reviews: null, stars: null };
  } catch(e) {
    console.warn('fetchSnapshot error:', e.message);
    return { price: null, hotelName: null, rating: null, reviews: null, stars: null };
  }
}

async function fetchRate(hotel, year, monthIdx, nights, currency) {
  var meta = { hotelName: null, stars: null, rating: null, reviews: null };
  var prices = [];
  var maxDay = new Date(year, monthIdx + 1, 0).getDate();
  for (var i = 0; i < SAMPLE_DAYS.length; i++) {
    var day = SAMPLE_DAYS[i];
    if (day > maxDay) continue;
    var cin = fmtDate(year, monthIdx, day);
    var cout = addNights(cin, nights);
    var snap = await fetchSnapshot(hotel.name, hotel.location, cin, cout, currency);
    if (snap.hotelName && !meta.hotelName) {
      meta = { hotelName: snap.hotelName, stars: snap.stars, rating: snap.rating, reviews: snap.reviews };
    }
    if (snap.price !== null) prices.push(snap.price);
    await delay(400);
  }
  var avg = prices.length ? Math.round(prices.reduce(function(a,b){ return a+b; }, 0) / prices.length) : null;
  var min = prices.length ? Math.min.apply(null, prices) : null;
  return { avg: avg, min: min, hotelName: meta.hotelName, stars: meta.stars, rating: meta.rating, reviews: meta.reviews };
}

async function runFetch() {
  var hotels = parseHotels();
  var proxyUrl = document.getElementById('proxyUrl').value.trim();
  if (!proxyUrl) { setStatus('Enter proxy URL first', 'error'); return; }
  if (!hotels.length) { setStatus('Enter at least one hotel', 'error'); return; }
  var year = parseInt(document.getElementById('year').value);
  var currency = document.getElementById('currency').value;
  var nightArr = parseNights();
  if (!nightArr.length) { setStatus('Enter valid night durations', 'error'); return; }

  document.getElementById('runBtn').disabled = true;
  document.getElementById('exportBtn').disabled = true;
  allData = {};
  var total = hotels.length * MONTHS.length * nightArr.length * SAMPLE_DAYS.length;
  var done = 0;
  var results = {};

  for (var hi = 0; hi < hotels.length; hi++) {
    var hotel = hotels[hi];
    var key = hotel.label;
    results[key] = { info: {}, ratesByNights: {} };
    for (var ni = 0; ni < nightArr.length; ni++) {
      var n = nightArr[ni];
      results[key].ratesByNights[n] = [];
      for (var m = 0; m < 12; m++) {
        var res = await fetchRate(hotel, year, m, n, currency);
        if (!results[key].info.name && res.hotelName) {
          results[key].info = { name: res.hotelName, stars: res.stars, rating: res.rating, reviews: res.reviews };
        }
        results[key].ratesByNights[n].push({ avg: res.avg, min: res.min });
        done += SAMPLE_DAYS.length;
        setStatus('Fetching ' + done + ' / ' + total + ' (' + hotel.name + ' - ' + MONTHS[m] + ')', 'active');
      }
    }
  }

  allData = results;
  renderResults(results, nightArr, currency, year);
  document.getElementById('runBtn').disabled = false;
  document.getElementById('exportBtn').disabled = false;
  setStatus('Done - ' + hotels.length + ' hotel(s), ' + total + ' snapshots', 'done');
}

function renderResults(results, nightArr, currency, year) {
  var sym = currencySymbol();
  var area = document.getElementById('resultsArea');
  area.innerHTML = '';
  var keys = Object.keys(results);
  if (!keys.length) { area.innerHTML = '<div class="empty-state"><div class="empty-text">No data</div></div>'; return; }

  var lbl = document.createElement('div');
  lbl.className = 'section-label';
  lbl.textContent = 'Market Rates - ' + year + ' - Per-night room rate (divide by 2 for pp netto)';
  area.appendChild(lbl);

  for (var ki = 0; ki < keys.length; ki++) {
    var key = keys[ki];
    var hotel = results[key];
    var card = document.createElement('div');
    card.className = 'hotel-card';

    var stars = hotel.info.stars ? parseInt(hotel.info.stars) : 0;
    var starsStr = '';
    for (var s = 0; s < stars; s++) starsStr += '\u2605';
    var ratingStr = hotel.info.rating ? ' - ' + hotel.info.rating + (hotel.info.reviews ? ' (' + hotel.info.reviews + ')' : '') : '';

    var hdr = document.createElement('div');
    hdr.className = 'hotel-card-header';
    hdr.innerHTML = '<span class="hotel-key">' + key + '</span>' +
      '<span class="hotel-name">' + (hotel.info.name || key) + '</span>' +
      (starsStr ? '<span class="hotel-stars">' + starsStr + '</span>' : '') +
      '<span class="hotel-meta">' + ratingStr + '</span>';
    card.appendChild(hdr);

    var wrap = document.createElement('div');
    wrap.className = 'rate-table-wrap';
    var table = document.createElement('table');
    table.className = 'rate-table';
    var hrow = '<thead><tr><th>Nights</th>';
    for (var mi = 0; mi < MONTHS.length; mi++) hrow += '<th>' + MONTHS[mi] + '</th>';
    hrow += '<th>Min</th><th>Avg</th></tr></thead>';
    table.innerHTML = hrow;

    var tbody = document.createElement('tbody');
    for (var ni = 0; ni < nightArr.length; ni++) {
      var n = nightArr[ni];
      var monthRates = hotel.ratesByNights[n];
      var perAvg = monthRates.map(function(o){ return o.avg !== null ? Math.round(o.avg / n) : null; });
      var perMin = monthRates.map(function(o){ return o.min !== null ? Math.round(o.min / n) : null; });
      var norm = normalise(perAvg);
      var validA = perAvg.filter(function(v){ return v !== null; });
      var validM = perMin.filter(function(v){ return v !== null; });
      var minV = validM.length ? Math.min.apply(null, validM) : null;
      var avgV = validA.length ? Math.round(validA.reduce(function(a,b){ return a+b; },0) / validA.length) : null;

      var tr = document.createElement('tr');
      var cells = '<td>' + n + ' nts</td>';
      for (var ci = 0; ci < perAvg.length; ci++) {
        var v = perAvg[ci];
        var fv = perMin[ci];
        if (v === null) {
          cells += '<td><span class="cell-val cell-empty">-</span></td>';
        } else {
          var c = heatColour(norm[ci]);
          var lowStr = (fv !== null && fv < v) ? '<span class="cell-low">lo ' + sym + fv + '</span>' : '';
          cells += '<td><span class="cell-val" style="background:' + c.bg + ';color:' + c.fg + '">' + sym + v + '</span>' + lowStr + '</td>';
        }
      }
      cells += '<td style="color:var(--blue);font-weight:500">' + (minV !== null ? sym + minV : '-') + '</td>';
      cells += '<td style="color:var(--mid)">' + (avgV !== null ? sym + avgV : '-') + '</td>';
      tr.innerHTML = cells;
      tbody.appendChild(tr);
    }

    var sumTr = document.createElement('tr');
    sumTr.className = 'summary-row';
    var sumCells = '<td>Best/night</td>';
    for (var m2 = 0; m2 < 12; m2++) {
      var bvals = [];
      for (var nj = 0; nj < nightArr.length; nj++) {
        var o = hotel.ratesByNights[nightArr[nj]][m2];
        if (o && o.avg !== null) bvals.push(Math.round(o.avg / nightArr[nj]));
      }
      sumCells += '<td>' + (bvals.length ? sym + Math.min.apply(null, bvals) : '-') + '</td>';
    }
    sumCells += '<td></td><td></td>';
    sumTr.innerHTML = sumCells;
    tbody.appendChild(sumTr);
    table.appendChild(tbody);
    wrap.appendChild(table);
    card.appendChild(wrap);

    var leg = document.createElement('div');
    leg.className = 'legend';
    leg.innerHTML = 'Heatmap: <span class="legend-swatch" style="background:#b7e1a1"></span>Low <span class="legend-swatch" style="background:#fff0a0"></span>Mid <span class="legend-swatch" style="background:#ffb250"></span>High - Avg of 4 snapshots (1st 8th 15th 22nd) - divide by 2 for pp netto';
    card.appendChild(leg);
    area.appendChild(card);
  }
}

function exportCSV() {
  if (!Object.keys(allData).length) return;
  var nightArr = parseNights();
  var year = document.getElementById('year').value;
  var cur = document.getElementById('currency').value;
  var rows = ['Hotel,Name,Nights,' + MONTHS.join(' Avg,') + ' Avg,Min/nt,OvAvg,' + MONTHS.join(' Low,') + ' Low'];
  for (var key in allData) {
    var hotel = allData[key];
    for (var ni = 0; ni < nightArr.length; ni++) {
      var n = nightArr[ni];
      var aArr = hotel.ratesByNights[n].map(function(o){ return o && o.avg !== null ? Math.round(o.avg/n) : ''; });
      var mArr = hotel.ratesByNights[n].map(function(o){ return o && o.min !== null ? Math.round(o.min/n) : ''; });
      var vA = aArr.filter(function(v){ return v !== ''; });
      var vM = mArr.filter(function(v){ return v !== ''; });
      var bestMin = vM.length ? Math.min.apply(null,vM) : '';
      var ovAvg = vA.length ? Math.round(vA.reduce(function(a,b){ return a+b; },0)/vA.length) : '';
      rows.push('"' + key + '","' + (hotel.info.name||'') + '",' + n + ',' + aArr.join(',') + ',' + bestMin + ',' + ovAvg + ',' + mArr.join(','));
    }
  }
  var blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hotel_rates_' + year + '_' + cur + '.csv';
  a.click();
}

</script>
